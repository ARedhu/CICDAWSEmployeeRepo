version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25
    commands:
      - echo Installing Maven...
  pre_build:
    commands:
      - echo Loggin in to Docker hub...
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  build:
    commands:
      - echo Building, Testing, and packaging the applications...
      - mvn clean package

artifacts:
  files:
    - '*.jar'
  base-directory: target

cache:
  paths:
    - '/root/.m2/repository/**/*'